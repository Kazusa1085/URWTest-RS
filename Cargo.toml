[package]
name = "urwtest-rs"
version = "0.1.0-Alpha1"
edition = "2024"
description = "Cross-platform mounted-volume read/write test tool"
license = "GPL-3.0-or-later"
repository = "https://github.com/Kazusa1085/URWTest-RS"
readme = "README.md"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
libc = "0.2.189"
rand = "0.8.8"
rand_chacha = "0.3.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
